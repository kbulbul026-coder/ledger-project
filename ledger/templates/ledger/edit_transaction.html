{% extends 'base.html' %}
{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h4 class="mb-1">लेन-देन एडिट करें</h4>
                    <p class="text-muted mb-4">ग्राहक: <strong>{{ customer.name }}</strong></p>

                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label class="form-label">रकम</label>
                            {{ form.amount }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">प्रकार</label>
                            {{ form.transaction_type }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">नोट / सामान</label>
                            {{ form.description }}
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">तारीख और समय</label>
                            {{ form.date }}
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">अपडेट करें</button>
                            <a href="{% url 'customer_detail' customer.id %}" class="btn btn-outline-secondary">रद्द करें</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
