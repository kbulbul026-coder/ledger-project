{% extends 'base.html' %}
{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h4 class="mb-4">नई कैश एंट्री</h4>

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">रकम</label>
                            {{ form.amount }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">प्रकार</label>
                            {{ form.entry_type }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">नोट</label>
                            {{ form.description }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">तारीख और समय</label>
                            {{ form.date }}
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">सेव करें</button>
                            <a href="{% url 'cashbook' %}" class="btn btn-outline-secondary">रद्द करें</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
